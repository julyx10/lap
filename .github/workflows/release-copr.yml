name: Release COPR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix, e.g. 0.3.3)'
        required: true
        type: string

permissions: {}

jobs:
  trigger-copr:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Trigger Fedora COPR build
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$COPR_WEBHOOK_URL" ]]; then
            echo "COPR_WEBHOOK_URL is not set, skipping."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${RELEASE_TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "::error::Version '$VERSION' is not valid (expected X.Y.Z)"
            exit 1
          fi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"version\": \"$VERSION\"}" "$COPR_WEBHOOK_URL"
          echo "COPR build triggered for $VERSION"
