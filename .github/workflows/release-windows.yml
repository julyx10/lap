name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag (required only when signing_mode is disabled)"
        required: false
        type: string
      build_target:
        description: "Architecture to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - x64
          - arm64
      signing_mode:
        description: "SignPath setup: prepare a sample ZIP or test-sign without publishing a release"
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - prepare
          - test

permissions:
  actions: read
  contents: write

env:
  # Pin the Tauri CLI so bundled toolchain changes in a floating
  # `@tauri-apps/cli@v2` cannot silently break packaging. Bump deliberately.
  TAURI_CLI_VERSION: '2.12.0'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Validate release and signing settings
        shell: bash
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_TEST_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          set -euo pipefail
          case "$SIGNING_MODE" in
            disabled)
              if [ -z "$RELEASE_TAG" ]; then
                echo "release_tag is required when signing_mode is disabled."
                exit 1
              fi
              ;;
            prepare) ;;
            test)
              for name in SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_TEST_SIGNING_POLICY_SLUG SIGNPATH_API_TOKEN; do
                if [ -z "${!name}" ]; then
                  echo "Missing SignPath setting: $name"
                  exit 1
                fi
              done
              ;;
            *) echo "Unknown signing_mode."; exit 1 ;;
          esac

      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          ALL='[
            {"arch":"x64","runner":"windows-2022","target":"x86_64-pc-windows-msvc","msvc_arch":"x64","msvc_vsversion":"2022","platform_key":"windows-x86_64","artifact_name":"windows-x86_64","msi_glob":"*_x64_*.msi"},
            {"arch":"arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","msvc_arch":"arm64","msvc_vsversion":"","platform_key":"windows-aarch64","artifact_name":"windows-aarch64","msi_glob":"*_arm64_*.msi"}
          ]'

          INPUT="${{ github.event.inputs.build_target }}"
          if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
            SEL="$ALL"
          else
            SEL=$(echo "$ALL" | jq -c --arg a "$INPUT" '[.[] | select(.arch == $a)]')
            if [ "$SEL" = "[]" ]; then
              echo "Unknown build_target: $INPUT"
              exit 1
            fi
          fi

          MATRIX=$(echo "$SEL" | jq -c '{include: .}')
          echo "Generated matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: windows-${{ matrix.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            windows-${{ matrix.arch }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\bin\
            ~\.cargo\registry\index\
            ~\.cargo\registry\cache\
            ~\.cargo\git\db\
          key: windows-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-${{ matrix.arch }}-cargo-release-

      - name: Install frontend dependencies
        working-directory: src-vite
        run: pnpm install --frozen-lockfile

      - name: Cache AI Models
        id: cache-ai-models
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models
          key: ${{ runner.os }}-models-${{ hashFiles('scripts/download_models.sh', 'scripts/download_models.ps1') }}

      - name: Download AI Models (Windows)
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: .\scripts\download_models.ps1

      - name: Force app frontend build command (Windows CI only)
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.build.beforeBuildCommand = "pnpm --dir ../src-vite build || pnpm --dir src-vite build"
          $json | ConvertTo-Json -Depth 100 | Set-Content -Path $path -Encoding utf8

      - name: Setup MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
          vsversion: ${{ matrix.msvc_vsversion }}

      - name: Set MSI runtime prerequisite version
        shell: pwsh
        run: |
          if (-not $env:VCToolsVersion) { throw "MSVC toolset version is missing." }
          $toolset = [version]$env:VCToolsVersion.Trim()
          $minimum = [version]::new($toolset.Major, $toolset.Minor, [Math]::Max(0, $toolset.Build), [Math]::Max(0, $toolset.Revision))
          "TAURI_LAP_VC_RUNTIME_MIN_VERSION=$minimum" >> $env:GITHUB_ENV
          Write-Host "MSI runtime minimum: $minimum"

      - name: Remove ranlib from PATH
        shell: pwsh
        run: |
          $paths = $env:PATH -split ';' | Where-Object {
            $_ -and
            -not (Test-Path (Join-Path $_ 'ranlib.exe'))
          }
          "PATH=$($paths -join ';')" >> $env:GITHUB_ENV

      - name: Clear cached Windows bundle artifacts
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/${{ matrix.target }}/release/bundle"
          if (Test-Path $bundleDir) {
            Remove-Item -Recurse -Force $bundleDir
          }

      - name: Download FFmpeg Sidecars (Windows)
        shell: pwsh
        run: .\scripts\download_ffmpeg_sidecar.ps1 -Arch ${{ matrix.arch }}

      - name: Install pinned Tauri CLI
        run: npm install -g @tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}

      - name: Build and Sign (Windows ${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v0.5
        env:
          # Work around ort-sys 2.0.0-rc.10 copy-dylibs breaking with Cargo's build-dir layout v2.
          __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: tauri
          args: --verbose --target ${{ matrix.target }} --bundles msi

      - name: Verify MSI runtime prerequisite
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/msi" -Filter "*.msi" -File)
          if ($msis.Count -ne 1) { throw "Expected exactly one Windows MSI." }
          .\scripts\test_windows_msi_runtime.ps1 -MsiPath $msis[0].FullName

      # upload-artifact supplies the ZIP envelope required by the SignPath configuration.
      # Upload only the MSI: its updater signature must be generated after Authenticode signing.
      - name: Upload unsigned SignPath sample
        if: inputs.signing_mode != 'disabled'
        id: signpath-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Test-sign MSI and embedded Lap executable
        if: inputs.signing_mode == 'test'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-msi
          github-artifact-id: ${{ steps.signpath-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Replace MSI and regenerate updater signature
        if: inputs.signing_mode == 'test'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle/msi"
          $original = @(Get-ChildItem $bundle -Filter '*.msi' -File)
          $signed = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'signpath-signed') -Filter '*.msi' -File)
          if ($original.Count -ne 1 -or $signed.Count -ne 1) { throw 'Expected one original and one signed MSI.' }
          if ($signed[0].Name -ne $original[0].Name) { throw 'SignPath returned an unexpected MSI filename.' }
          $signature = Get-AuthenticodeSignature $signed[0].FullName
          # A self-signed test certificate is not expected to be trusted by this runner.
          if (-not $signature.SignerCertificate -or $signature.Status -in @('NotSigned', 'HashMismatch')) {
            throw "Missing or invalid MSI signature: $($signature.Status)"
          }
          Write-Host "Test signer: $($signature.SignerCertificate.Subject); status: $($signature.Status)"
          Copy-Item $signed[0].FullName $original[0].FullName -Force
          Remove-Item "$($original[0].FullName).sig" -Force -ErrorAction SilentlyContinue
          tauri signer sign $original[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Failed to regenerate the updater signature.' }
          if (-not (Test-Path "$($original[0].FullName).sig")) { throw 'Updater signature was not generated.' }
          .\scripts\test_windows_msi_runtime.ps1 -MsiPath $original[0].FullName

      - name: Upload Build Artifact (Windows ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.signing_mode == 'test' && format('signpath-test-{0}', matrix.artifact_name) || matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          if-no-files-found: error

  publish-windows:
    # Self-signed test installers must never replace public release assets or latest.json.
    if: inputs.signing_mode == 'disabled'
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: ls -la release-files

      - name: Show current release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          gh release view "$TAG" -R "$GH_REPO" --json assets --jq '.assets[].name'

      - name: Wait for latest.json asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          for i in $(seq 1 80); do
            rm -f release-files/latest.json
            if gh release download "$TAG" -R "$GH_REPO" -p "latest.json" -D release-files >/dev/null 2>&1; then
              echo "latest.json for $TAG is available."
              exit 0
            fi
            echo "latest.json not ready yet for $TAG (attempt $i/80), waiting 30s..."
            sleep 30
          done
          echo "Timed out waiting for latest.json on release $TAG."
          exit 1

      - name: Update latest.json with Windows updater entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.release_tag }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          rm -f release-files/latest.json
          gh release download "$TAG" -R "$GH_REPO" -p "latest.json" -D release-files >/dev/null 2>&1
          if [ ! -f release-files/latest.json ]; then
            echo "latest.json is required but was not downloaded."
            exit 1
          fi

          # merge_entry <platform_key> <msi_glob>
          # Tauri's MSI filename embeds the architecture: "Lap_<version>_x64_en-US.msi"
          # or "Lap_<version>_arm64_en-US.msi", so we can separate architectures by glob.
          merge_entry() {
            local key="$1"
            local glob="$2"

            local msi
            msi="$(find release-files -maxdepth 1 -type f -name "$glob" ! -name '*.sig' | head -n 1)"
            if [ -z "${msi}" ]; then
              echo "No MSI found matching '$glob' for $key — skipping."
              return 0
            fi

            local sig_file="${msi}.sig"
            if [ ! -f "$sig_file" ]; then
              echo "Missing updater signature file for $msi ($key)."
              exit 1
            fi

            local name sig_content tmp
            name="$(basename "$msi")"
            sig_content="$(cat "$sig_file")"
            tmp="$(mktemp)"

            jq \
              --arg version "$VERSION" \
              --arg pub_date "$PUB_DATE" \
              --arg key "$key" \
              --arg sig "$sig_content" \
              --arg url "https://github.com/${REPO}/releases/download/${TAG}/${name}" \
              '
              .version = $version
              | .pub_date = $pub_date
              | .platforms = (.platforms // {})
              | .platforms[$key] = {"signature": $sig, "url": $url}
              ' release-files/latest.json > "$tmp"
            mv "$tmp" release-files/latest.json
            echo "Recorded $key -> $name"
          }

          merge_entry "windows-x86_64" "*_x64_*.msi"
          merge_entry "windows-aarch64" "*_arm64_*.msi"

          echo "Final latest.json:"
          cat release-files/latest.json

      - name: Upload Windows assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          gh release upload "$TAG" -R "$GH_REPO" release-files/* --clobber
